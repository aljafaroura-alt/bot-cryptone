name: Cryptone v3 Radar

on:
  # Re-trigger periodically so a new run picks up right after the previous
  # one hits its internal RUN_DURATION_SECONDS cap and exits gracefully.
  # GitHub's schedule can drift by several minutes, so the interval here
  # (5h) is kept comfortably under both the job's own duration cap (5h50m)
  # and the hard 6h GitHub Actions job limit.
  schedule:
    - cron: "0 */5 * * *"
  # Manual trigger for testing/debugging without waiting for the schedule.
  workflow_dispatch:
    inputs:
      run_duration_seconds:
        description: "Override RUN_DURATION_SECONDS for this manual run (seconds)"
        required: false
        default: "300"
      check_only:
        description: "Run only the quick data-integrity check (--check) instead of the full loop"
        required: false
        default: "false"

# Prevent overlapping runs: if a previous run is somehow still going when
# the next schedule fires, queue behind it rather than running two bots
# in parallel against the same Telegram chat / Hyperliquid connection.
concurrency:
  group: cryptone-v3-radar
  cancel-in-progress: false

jobs:
  run-radar:
    runs-on: ubuntu-latest
    # Hard ceiling as a second line of defense on top of the script's own
    # RUN_DURATION_SECONDS graceful-exit guard. Comfortably under the
    # platform's 6h max for public repos on the free tier.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Quick data integrity check
        if: ${{ github.event.inputs.check_only == 'true' }}
        run: python cryptone_v3.py --check

      - name: Run Cryptone radar
        if: ${{ github.event.inputs.check_only != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HYPERLIQUID_API: ${{ vars.HYPERLIQUID_API }}
          HYPERLIQUID_WS: ${{ vars.HYPERLIQUID_WS }}
          DISCOVERY_MAX_CANDIDATES: ${{ vars.DISCOVERY_MAX_CANDIDATES }}
          DISCOVERY_SCAN_INTERVAL: ${{ vars.DISCOVERY_SCAN_INTERVAL }}
          WS_SYMBOLS: ${{ vars.WS_SYMBOLS }}
          ANCHOR_SYMBOLS: ${{ vars.ANCHOR_SYMBOLS }}
          # 5h50m default so the script exits itself well before the
          # 350-minute job timeout above forcibly kills it.
          RUN_DURATION_SECONDS: ${{ github.event.inputs.run_duration_seconds || '21000' }}
        run: python cryptone_v3.py
        # triggers
