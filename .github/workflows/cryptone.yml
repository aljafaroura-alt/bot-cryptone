name: Cryptone v3 Radar

on:
  schedule:
    - cron: "0 */5 * * *"
  workflow_dispatch:
    inputs:
      run_duration_seconds:
        description: "Override RUN_DURATION_SECONDS for this manual run (seconds)"
        required: false
        default: "21000"
      check_only:
        description: "Run only the quick data-integrity check (--check) instead of the full loop"
        required: false
        default: "false"
      reset_state:
        description: "Discard saved state.json and start fresh this run (true/false)"
        required: false
        default: "false"
      relaunch:
        description: "Internal: whether this run should re-trigger itself when it ends (true/false)"
        required: false
        default: "true"

concurrency:
  group: cryptone-v3-radar
  cancel-in-progress: false

permissions:
  actions: write   # required so the job can dispatch a new run of itself
  contents: read

jobs:
  run-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 358   # just under GitHub's 360min (6h) hard cap for hosted runners

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Rolling-key cache: restore-keys always falls back to the most
      # recent cache under the "cryptone-state-" prefix, and since `key`
      # includes github.run_id (unique every run) it never hits an exact
      # match, so actions/cache always saves a fresh entry at the end of
      # the job. Net effect: every run picks up state.json from wherever
      # the previous run left off, without ever needing a fixed key that
      # would block re-saving.
      - name: Restore radar state
        if: ${{ github.event.inputs.reset_state != 'true' }}
        uses: actions/cache@v4
        with:
          path: data
          key: cryptone-state-${{ github.run_id }}
          restore-keys: |
            cryptone-state-

      - name: Quick data integrity check
        if: ${{ github.event.inputs.check_only == 'true' }}
        run: python cryptone_v3.py --check

      # id added so the relaunch step below can, if ever needed, inspect
      # this specific step's outcome (steps.run_radar.outcome /
      # steps.run_radar.conclusion) rather than only the job-level status.
      - name: Run Cryptone radar
        id: run_radar
        if: ${{ github.event.inputs.check_only != 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          HYPERLIQUID_API: ${{ vars.HYPERLIQUID_API }}
          HYPERLIQUID_WS: ${{ vars.HYPERLIQUID_WS }}
          DISCOVERY_MAX_CANDIDATES: ${{ vars.DISCOVERY_MAX_CANDIDATES }}
          DISCOVERY_SCAN_INTERVAL: ${{ vars.DISCOVERY_SCAN_INTERVAL }}
          WS_SYMBOLS: ${{ vars.WS_SYMBOLS }}
          ANCHOR_SYMBOLS: ${{ vars.ANCHOR_SYMBOLS }}
          STORAGE_PATH: data
          # ~5h50m — leaves ~8min headroom below timeout-minutes so the
          # process exits cleanly (checkpoint + disconnect) instead of
          # racing GitHub's hard SIGKILL at the timeout boundary.
          RUN_DURATION_SECONDS: ${{ github.event.inputs.run_duration_seconds || '21000' }}
        run: python cryptone_v3.py

      # Surface state.json as a build artifact too — separate from the
      # cache, useful for manually inspecting/downloading what got saved,
      # or as a recovery copy if the cache entry ever gets evicted
      # (GitHub evicts cache entries unused for 7+ days, or beyond the
      # 10GB per-repo cache cap).
      - name: Upload state snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptone-state-${{ github.run_id }}
          path: data/state.json
          retention-days: 14
          if-no-files-found: ignore

      # "Infinity pool": relaunch this same workflow the moment this run
      # ends, so in steady state the radar chains itself continuously
      # instead of sitting idle between cron ticks. Runs *in addition to*
      # the every-5-hours cron.
      #
      # Changed from `if: always()` to `if: !cancelled()`:
      #   - `always()` re-triggers unconditionally, even when the run was
      #     manually cancelled or stuck/hung. Combined with
      #     `cancel-in-progress: false`, a bad run (cancelled, hung,
      #     repeatedly failing) kept spawning new queued runs behind it
      #     with no way to stop the chain short of manually cancelling
      #     every run in the queue — which is exactly what happened.
      #   - `!cancelled()` still relaunches on success AND on ordinary
      #     failure (so a transient crash doesn't kill the radar
      #     permanently), but stops the chain the moment a run is
      #     cancelled — manually, or by GitHub for exceeding
      #     timeout-minutes. That gives you a clean, reliable way to stop
      #     the loop by hand: cancel one run, and no new run gets queued
      #     behind it.
      #
      # Still skips relaunching when:
      #   - this was itself a --check-only run
      #   - the run explicitly opted out via relaunch=false (manual
      #     override to break the loop without waiting on a cancel)
      - name: Relaunch radar (self-dispatch)
        if: >-
          ${{
            !cancelled() &&
            github.event.inputs.check_only != 'true' &&
            github.event.inputs.relaunch != 'false'
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Re-triggering ${{ github.workflow }} to keep the radar running continuously..."
          gh workflow run "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}" \
            -f run_duration_seconds="${{ github.event.inputs.run_duration_seconds || '21000' }}" \
            -f check_only="false" \
            -f reset_state="false" \
            -f relaunch="true"
